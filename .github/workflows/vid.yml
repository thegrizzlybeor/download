name: VID

on:
  workflow_dispatch:

jobs:
  process-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg cmake g++ git zlib1g-dev libssl-dev gperf php-cli make
          pip install -U yt-dlp

      - name: Build local Bot API server
        run: |
          git clone --recursive https://github.com/tdlib/telegram-bot-api.git
          cd telegram-bot-api
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --target install -j$(nproc)

      - name: Start local Bot API server
        run: |
          telegram-bot-api --api-id=${{ secrets.TELEGRAM_API_ID }} \
                            --api-hash=${{ secrets.TELEGRAM_API_HASH }} \
                            --local &
          sleep 10

      - name: Process each link
        env:
          VID_LINKS: ${{ secrets.VID }}
        run: |
          set -uo pipefail

          echo "$VID_LINKS" | while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "=== Processing: $url ==="

            rm -f video.* compressed.mp4

            if ! yt-dlp -o "video.%(ext)s" \
                        --merge-output-format mp4 \
                        -f "bestvideo[filesize<2000M]+bestaudio/best[filesize<2000M]/best" \
                        "$url"; then
              echo "!!! yt-dlp failed for $url, skipping"
              continue
            fi

            FILE="video.mp4"
            if [ ! -f "$FILE" ]; then
              # fallback in case the container isn't mp4 for some reason
              FILE=$(ls video.* 2>/dev/null | head -n 1)
            fi
            if [ -z "${FILE:-}" ] || [ ! -f "$FILE" ]; then
              echo "!!! No downloaded file found for $url, skipping"
              continue
            fi

            if ! ffmpeg -y -i "$FILE" -vf "scale=1280:-2" \
                   -c:v libx264 -crf 23 -preset veryfast \
                   -c:a aac -b:a 128k \
                   -movflags +faststart \
                   compressed.mp4; then
              echo "!!! ffmpeg failed for $url, skipping"
              continue
            fi

            if [ ! -s compressed.mp4 ]; then
              echo "!!! compressed.mp4 missing/empty for $url, skipping"
              continue
            fi

            WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 compressed.mp4)
            HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 compressed.mp4)
            DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 compressed.mp4 | cut -d. -f1)

            curl -sS -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                 -F video=@"compressed.mp4" \
                 -F width="$WIDTH" \
                 -F height="$HEIGHT" \
                 -F duration="$DURATION" \
                 -F supports_streaming=true \
                 "http://localhost:8081/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo"

            echo "=== Done: $url ==="
          done
