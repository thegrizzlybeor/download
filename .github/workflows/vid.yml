name: VID

on:
  workflow_dispatch:

jobs:
  process-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -U gallery-dl

      - name: Get local Bot API server binary
        run: |
          docker pull sayyid5416/telegram-bot-api:latest
          id=$(docker create sayyid5416/telegram-bot-api:latest)
          docker cp "$id":/usr/local/bin/telegram-bot-api ./telegram-bot-api || \
          docker cp "$id":/bin/telegram-bot-api ./telegram-bot-api
          docker rm "$id"
          chmod +x ./telegram-bot-api
          sudo mv ./telegram-bot-api /usr/local/bin/telegram-bot-api

      - name: Start local Bot API server
        run: |
          telegram-bot-api --api-id=${{ secrets.TELEGRAM_API_ID }} \
                            --api-hash=${{ secrets.TELEGRAM_API_HASH }} \
                            --local &
          sleep 10

      - name: Process each link
        env:
          VID_LINKS: ${{ secrets.VID }}
        run: |
          set -uo pipefail

          echo "$VID_LINKS" | while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "=== Processing: $url ==="

            rm -rf dl video.* compressed.mp4
            mkdir -p dl

            if ! gallery-dl -D dl -o filename="video.{extension}" "$url"; then
              echo "!!! gallery-dl failed for $url, skipping"
              continue
            fi

            FILE=$(find dl -type f \( -iname "*.mp4" -o -iname "*.webm" -o -iname "*.mkv" -o -iname "*.mov" \) | head -n 1)
            if [ -z "${FILE:-}" ] || [ ! -f "$FILE" ]; then
              echo "!!! No downloaded video file found for $url, skipping"
              continue
            fi

            if ! ffmpeg -y -i "$FILE" -vf "scale=1280:-2" \
                   -c:v libx264 -crf 23 -preset veryfast \
                   -c:a aac -b:a 128k \
                   -movflags +faststart \
                   compressed.mp4; then
              echo "!!! ffmpeg failed for $url, skipping"
              continue
            fi

            if [ ! -s compressed.mp4 ]; then
              echo "!!! compressed.mp4 missing/empty for $url, skipping"
              continue
            fi

            WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 compressed.mp4)
            HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 compressed.mp4)
            DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 compressed.mp4 | cut -d. -f1)

            curl -sS -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                 -F video=@"compressed.mp4" \
                 -F width="$WIDTH" \
                 -F height="$HEIGHT" \
                 -F duration="$DURATION" \
                 -F supports_streaming=true \
                 "http://localhost:8081/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo"

            echo "=== Done: $url ==="
          done
