name: MEDIA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to process"
        required: true
        type: choice
        options:
          - video
          - image
          - all
        default: all

jobs:
  process-all:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg webp p7zip-full
          pip install -U gallery-dl

      # -----------------------------------------------------------------
      # Cache the compiled telegram-bot-api binary so we only pay the
      # cmake/TDLib build cost once, instead of on every single run.
      # -----------------------------------------------------------------
      - name: Cache telegram-bot-api binary
        id: cache-tbai
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/telegram-bot-api
          key: tbai-${{ runner.os }}-v1

      - name: Build local Bot API server
        if: steps.cache-tbai.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y cmake g++ git zlib1g-dev libssl-dev gperf php-cli make
          git clone --recursive https://github.com/tdlib/telegram-bot-api.git
          cd telegram-bot-api
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --target install -j$(nproc)

      - name: Start local Bot API server
        run: |
          telegram-bot-api --api-id=${{ secrets.TELEGRAM_API_ID }} \
                            --api-hash=${{ secrets.TELEGRAM_API_HASH }} \
                            --local &
          sleep 10

      - name: Process each link
        env:
          LINKS: ${{ secrets.M }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          # NOTE: using process substitution (< <(...)) instead of piping
          # into the while loop. This keeps the loop's stdin isolated from
          # any command run inside it.
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "=== Processing: $url (mode=$MODE) ==="

            rm -rf downloads compressed compressed.mp4 thumb.jpg gallery.7z
            mkdir -p downloads compressed

            gallery-dl "$url" -d ./downloads

            SENT_VIDEO=0
            SENT_IMAGE=0

            if [ "$MODE" = "video" ] || [ "$MODE" = "all" ]; then
              VIDEO_FILES=$(find ./downloads -type f \( -iname "*.mp4" -o -iname "*.webm" -o -iname "*.mkv" -o -iname "*.mov" -o -iname "*.avi" \))
              if [ -n "$VIDEO_FILES" ]; then
                while IFS= read -r vidfile; do
                  [ -z "$vidfile" ] && continue
                  rm -f compressed.mp4 thumb.jpg

                  # -nostdin: CRITICAL. Without this, ffmpeg reads from the
                  # same stdin as the outer "while read url" loop and can
                  # swallow the remaining links/videos, so only the first
                  # one ever gets processed. This was the root cause of
                  # "sometimes" only one link/video going through.
                  #
                  # -pix_fmt yuv420p: forces standard 4:2:0 chroma so mobile
                  # Telegram clients can hardware-decode and progressively
                  # stream the file instead of falling back to a full
                  # download-then-play.
                  #
                  # scale=-2:540 + crf 28: targets ~540p and roughly a 60%+
                  # size cut vs the previous 1280-wide/crf23 encode.
                  ffmpeg -nostdin -y -i "$vidfile" \
                         -vf "scale=-2:540" \
                         -c:v libx264 -preset veryfast -crf 28 -pix_fmt yuv420p \
                         -c:a aac -b:a 96k \
                         -movflags +faststart \
                         compressed.mp4

                  WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 compressed.mp4)
                  HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 compressed.mp4)
                  DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 compressed.mp4 | cut -d. -f1)

                  # Grab a thumbnail so Telegram shows the scrubber/duration
                  # immediately instead of waiting on the client to generate one.
                  ffmpeg -nostdin -y -ss 1 -i compressed.mp4 -vframes 1 -vf "scale=320:-1" thumb.jpg 2>/dev/null

                  curl -sS -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                       -F video=@"compressed.mp4" \
                       -F thumb=@"thumb.jpg" \
                       -F width="$WIDTH" \
                       -F height="$HEIGHT" \
                       -F duration="$DURATION" \
                       -F supports_streaming=true \
                       "http://localhost:8081/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo"
                done <<< "$VIDEO_FILES"
                SENT_VIDEO=1
              fi
            fi

            if [ "$MODE" = "image" ] || [ "$MODE" = "all" ]; then
              IMG_FILES=$(find ./downloads -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.bmp" -o -iname "*.gif" \))
              if [ -n "$IMG_FILES" ]; then
                while IFS= read -r img; do
                  [ -z "$img" ] && continue
                  filename=$(basename "$img")
                  name="${filename%.*}"
                  cwebp -q 85 -m 6 -mt -sharp_yuv "$img" -o "./compressed/${name}.webp" 2>/dev/null || cp "$img" "./compressed/"
                done <<< "$IMG_FILES"

                7z a -y -mx=9 gallery.7z ./compressed/*

                curl -sS -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                     -F document=@"gallery.7z" \
                     "http://localhost:8081/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
                SENT_IMAGE=1
              fi
            fi

            if [ "$SENT_VIDEO" -eq 0 ] && [ "$SENT_IMAGE" -eq 0 ]; then
              echo "=== Nothing found for: $url ==="
            fi

            echo "=== Done: $url ==="
          done <<< "$LINKS"
